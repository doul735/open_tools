name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/open-gil/pyproject.toml

      - name: Install package
        run: python -m pip install -e "./packages/open-gil[dev]"

      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest packages/open-gil/tests -p no:cacheprovider

  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/open-gil/pyproject.toml

      - name: Install build tools
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build packages/open-gil

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/open-gil/dist/*
          if-no-files-found: error
